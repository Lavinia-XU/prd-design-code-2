<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <style>
    :root { --bg:#f5f7fb; --panel:#ffffff; --line:#e5e7eb; --text:#1f2937; --muted:#6b7280; --brand:#2563eb; --brand-bg:#eff6ff; --code-bg:#0f172a; --code:#e2e8f0; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif; background:var(--bg); color:var(--text); font-size:12px; }
    .app { display:flex; height:100vh; overflow:hidden; }
    .sidebar { width:300px; background:#0f172a; color:#cbd5e1; overflow:auto; padding:20px 14px; }
    .brand { color:#fff; font-size:18px; font-weight:700; line-height:1.4; margin:0 8px 18px; }
    .nav-section { margin:18px 8px 8px; color:#94a3b8; font-size:12px; letter-spacing:.04em; }
    .nav-item { display:block; width:100%; border:0; background:transparent; color:#cbd5e1; text-align:left; padding:9px 10px; border-radius:8px; cursor:pointer; font-size:14px; line-height:1.4; }
    .nav-item:hover { background:#1e293b; color:#fff; }
    .nav-item.active { background:#2563eb; color:#fff; }
    .nav-indent-1 { padding-left:22px; }
    .nav-indent-2 { padding-left:34px; }
    .nav-indent-3 { padding-left:46px; }
    .nav-indent-4 { padding-left:58px; }
    .content { flex:1; overflow:auto; padding:0; }
    .toolbar { position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 36px; background:rgba(245,247,251,.96); border-bottom:1px solid var(--line); backdrop-filter: blur(8px); }
    .toolbar-title { font-weight:700; color:#111827; }
    .toolbar-actions { display:flex; gap:8px; }
    .toggle-btn { border:1px solid var(--line); background:#fff; color:#374151; border-radius:8px; padding:7px 12px; cursor:pointer; font-size:12px; }
    .toggle-btn.active { background:var(--brand); border-color:var(--brand); color:#fff; }
    .view { max-width:1180px; margin:0 auto; padding:28px 36px; }
    .view.hidden { display:none; }
    .page { display:block; max-width:1180px; margin:0 auto 24px; scroll-margin-top:76px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px; margin-bottom:18px; box-shadow:0 6px 20px rgba(15,23,42,.04); }
    h1 { font-size:24px; margin:0 0 18px; }
    h2 { font-size:18px; margin:0 0 14px; }
    h3 { font-size:16px; margin:18px 0 10px; }
    strong { font-size:14px; }
    p { line-height:1.7; font-size:12px; }
    .muted { color:var(--muted); }
    table { width:100%; border-collapse:collapse; margin:10px 0; background:#fff; }
    th, td { border:1px solid var(--line); padding:10px 12px; text-align:left; vertical-align:top; line-height:1.5; font-size:12px; }
    th { background:#f9fafb; font-weight:600; }
    .tag { display:inline-block; padding:3px 8px; border-radius:999px; background:var(--brand-bg); color:var(--brand); font-size:12px; margin-left:8px; }
    ul { margin-top:8px; padding-left:20px; line-height:1.8; }
    .section-block { border-left:4px solid var(--brand); padding-left:14px; margin:18px 0 22px; }
    .section-block h3 { text-align:left; margin-top:0; }
    .wireframe-block { background:var(--code-bg); color:var(--code); border-radius:12px; padding:18px; overflow:auto; }
    .wireframe-block h3 { color:#fff; margin-top:0; }
    .wireframe-block p { color:#cbd5e1; }
    .wireframe-block pre { margin:10px 0 0; font-size:12px; line-height:1.6; white-space:pre; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .markdown-section { scroll-margin-top:76px; margin-bottom:28px; }
    .markdown-source { background:var(--code-bg); color:var(--code); border-radius:14px; padding:22px; overflow:auto; white-space:pre-wrap; word-break:break-word; font-size:12px; line-height:1.7; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; border:1px solid #1e293b; }
    .stack { display:block; }
    .stack > div { margin:12px 0; }
    .meta-list { display:grid; grid-template-columns:120px 1fr; gap:8px 14px; line-height:1.7; }
    .meta-list dt { color:var(--muted); font-weight:600; }
    .meta-list dd { margin:0; }
    .grid { display:block; }
    @media (max-width: 900px) { .app { flex-direction:column; } .sidebar { width:100%; height:260px; } .content { padding:0; } .toolbar { padding:12px 18px; } .view { padding:18px; } .meta-list { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">{{TITLE}}</div>
      {{NAV}}
    </aside>
    <main class="content" id="content">
      <div class="toolbar">
        <div class="toolbar-title">默认读取 Markdown 源文；预览仅用于人类审阅</div>
        <div class="toolbar-actions">
          <button class="toggle-btn active" data-view="source">源文</button>
          <button class="toggle-btn" data-view="preview">预览</button>
        </div>
      </div>
      <div id="source-view" class="view">{{SOURCE_CONTENT}}</div>
      <div id="preview-view" class="view hidden">{{PREVIEW_CONTENT}}</div>
    </main>
  </div>
  <script>
    const navButtons = document.querySelectorAll('.nav-item');
    const toggleButtons = document.querySelectorAll('.toggle-btn');
    const sourceView = document.getElementById('source-view');
    const previewView = document.getElementById('preview-view');
    const content = document.getElementById('content');
    let currentView = 'source';

    function targetIds(base) {
      return currentView === 'source' ? ['source-' + base, base] : [base, 'source-' + base];
    }

    function setActiveNav(base) {
      navButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.target === base));
    }

    function scrollToBase(base) {
      const ids = targetIds(base);
      const el = ids.map(id => document.getElementById(id)).find(Boolean);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        setActiveNav(base);
      }
    }

    function switchView(view) {
      currentView = view;
      sourceView.classList.toggle('hidden', view !== 'source');
      previewView.classList.toggle('hidden', view !== 'preview');
      toggleButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.view === view));
      const active = document.querySelector('.nav-item.active') || navButtons[0];
      if (active) setTimeout(() => scrollToBase(active.dataset.target), 0);
    }

    navButtons.forEach(btn => btn.addEventListener('click', () => scrollToBase(btn.dataset.target)));
    toggleButtons.forEach(btn => btn.addEventListener('click', () => switchView(btn.dataset.view)));
    if (navButtons.length) setActiveNav(navButtons[0].dataset.target);
  </script>
</body>
</html>
